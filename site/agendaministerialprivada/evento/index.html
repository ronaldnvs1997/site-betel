<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Ficha do evento · Agenda Ministerial · Igreja Batista Betel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500,100;0,9..144,600,100;1,9..144,400,0&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../identidade.css">
<style>
  :root{color-scheme:dark;--sans:"Montserrat",system-ui,sans-serif;--disp:"Fraunces",Georgia,serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--sup,#120707);color:var(--tinta,#FBEFE0);font:16px/1.55 var(--sans,"Manrope",system-ui,sans-serif)}
  .topo{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--linha,rgba(255,255,255,.12))}
  .topo img{height:46px;width:auto}
  .topo span{font:500 12px var(--mono,monospace);letter-spacing:.14em;text-transform:uppercase;color:var(--creme,#FFE1B2)}
  main{max-width:760px;margin:0 auto;padding:28px 18px 80px}
  h1{font:800 clamp(34px,8vw,56px)/1 var(--sans);letter-spacing:-.035em;color:#fff;margin:8px 0 14px}
  h1 em{font-family:var(--disp);font-style:italic;font-weight:400;color:var(--creme,#FFE1B2);letter-spacing:-.01em}
  .eyebrow{font:500 12px/1.4 var(--mono,monospace);letter-spacing:.14em;text-transform:uppercase;color:var(--creme,#FFE1B2);margin:0}
  .lead{color:var(--suave,#CDB8A6);font-size:17px;margin:0 0 18px}
  .card{background:var(--vidro,rgba(255,255,255,.05));border:1px solid var(--linha,rgba(255,255,255,.12));border-radius:24px;padding:20px;margin:16px 0}
  .card h2{font:italic 400 24px var(--disp);margin:0 0 12px;color:var(--creme,#FFE1B2)}
  label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px;margin:0 0 14px}
  input,select,textarea{width:100%;font:inherit;font-weight:500;color:var(--tinta,#FBEFE0);background:rgba(0,0,0,.28);border:1px solid var(--linha,rgba(255,255,255,.18));border-radius:14px;padding:12px 14px;min-height:48px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--creme,#FFE1B2);outline-offset:1px}
  textarea{min-height:96px;resize:vertical}
  .dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .espacos{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px}
  .espacos label{flex-direction:row;align-items:center;gap:10px;margin:0;padding:12px 14px;border:1px solid var(--linha,rgba(255,255,255,.18));border-radius:14px;min-height:48px;cursor:pointer}
  .espacos input{width:20px;height:20px;min-height:0}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:999px;border:0;font:700 16px var(--sans,sans-serif);cursor:pointer;text-decoration:none}
  .btn-p{background:var(--creme,#FFE1B2);color:var(--vinho,#582121)}
  .btn-p:disabled{opacity:.6;cursor:wait}
  .aviso{border-left:3px solid var(--creme,#FFE1B2);padding:10px 14px;border-radius:10px;background:rgba(255,225,178,.07);font-size:15px}
  .erro{color:#FFB4B4;font-weight:600}
  .ok{text-align:center;padding:30px 20px}
  .ok h2{font:italic 400 34px var(--disp);margin:8px 0}
  [hidden]{display:none !important}
  small{color:var(--suave,#CDB8A6);font-weight:500}
  @media (max-width:560px){.dupla{grid-template-columns:1fr}main{padding:22px 14px 70px}.card{padding:16px;border-radius:20px}.btn{width:100%}}
</style>
</head>
<body>
<header class="topo"><img src="../../img/logo.png" alt="Igreja Batista Betel"><span>Agenda Ministerial</span></header>
<main id="tela">
  <p class="eyebrow">Ficha do evento</p>
  <h1>Carregando…</h1>
</main>
<script src="../../config.js"></script>
<script src="../../vendor/supabase.js"></script>
<script>
(() => {
  const tela = document.getElementById("tela");
  const h = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // código do link: ?t=... (ou #t=... ), 64 caracteres
  const params = new URLSearchParams(location.search), hp = new URLSearchParams(location.hash.slice(1));
  const token = (params.get("t") || hp.get("t") || "").trim().toLowerCase();
  const CFG = window.BETEL_SUPABASE;
  const MOTIVOS = { expirado: "Este link expirou.", revogado: "Este link foi desativado.", bloqueado: "Muitas tentativas em pouco tempo. Aguarde alguns minutos e tente de novo.", invalido: "Link inválido ou incompleto." };
  function fim(titulo, texto) {
    tela.innerHTML = `<p class="eyebrow">Ficha do evento</p><h1>${titulo}</h1><p class="lead">${h(texto)}</p>
      <div class="aviso">Se você recebeu este link da coordenação da Agenda, peça um novo link a ela.</div>`;
  }
  if (!CFG || !window.supabase) return fim("Não foi possível <em>abrir</em>.", "Tente novamente em alguns instantes.");
  if (!/^[0-9a-f]{64}$/.test(token)) return fim("Link <em>inválido</em>.", MOTIVOS.invalido);
  const sb = window.supabase.createClient(CFG.url, CFG.anonKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
  const hoje = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  const SN = (nome, rotulo, v, extra = "") => `<label>${rotulo} *<select name="${nome}" required ${extra}><option value="">Selecione…</option>${["Sim", "Não"].map((x) => `<option${v === x ? " selected" : ""}>${x}</option>`).join("")}</select></label>`;

  function formulario(info) {
    const d = info.envio?.dados || {}, locais = String(d.local || "").split(",").map((x) => x.trim());
    const complemento = !!info.envio;
    tela.innerHTML = `<p class="eyebrow">${h(info.rotulo)}</p><h1>Ficha do <em>evento</em>.</h1>
      <p class="lead">Preencha as informações para a Agenda Ministerial. O envio será analisado pela coordenação antes de entrar na Agenda.</p>
      ${complemento ? `<div class="aviso">Você já enviou esta ficha em ${h(new Date(info.envio.enviado_em).toLocaleString("pt-BR"))}. Ela ainda está em análise: pode complementar e enviar de novo.</div>` : ""}
      <form id="ficha" novalidate>
        <section class="card"><h2>Evento</h2>
          <label>Nome do evento *<input name="titulo" required maxlength="120" value="${h(d.titulo || info.titulo_sugerido || "")}" placeholder="Ex.: Retiro de Casais"></label>
          <div class="dupla"><label>Data *<input type="date" name="data" required min="${hoje}" value="${h(d.data || "")}"></label>
            ${info.ministerio_fixo ? `<label>Ministério<input value="${h(info.ministerio_fixo)}" disabled></label>`
              : `<label>Ministério / departamento *<select name="ministerio" required><option value="">Selecione…</option>${(info.ministerios || []).map((m) => `<option${d.ministerio === m ? " selected" : ""}>${h(m)}</option>`).join("")}</select></label>`}</div>
          <label>Nome do líder responsável *<input name="lider" required maxlength="120" value="${h(d.lider || "")}" placeholder="Ex.: Pr. Carlos / Ana Paula" autocomplete="name"></label>
          <div class="dupla"><label>Horário de início *<input type="time" name="horario_inicio" required value="${h(d.horario_inicio || "")}"></label>
            <label>Horário de término *<input type="time" name="horario_fim" required value="${h(d.horario_fim || "")}"></label></div>
          <p style="font-weight:600;margin:0 0 8px">Espaços * <small>(marque um ou mais)</small></p>
          <div class="espacos">${["Templo", "Salão de Festas", "Quadra"].map((l) => `<label><input type="checkbox" name="locais" value="${l}"${locais.includes(l) ? " checked" : ""}> ${l}</label>`).join("")}</div>
        </section>
        <section class="card"><h2>Apoio</h2>
          ${SN("necessita_midia", "Necessita de Mídia?", d.necessita_midia)}
          ${SN("necessita_louvor", "Necessita de equipe de Louvor?", d.necessita_louvor)}
          ${SN("necessita_diaconia", "Necessita de Diaconia?", d.necessita_diaconia)}
          <div id="blocoMidia" ${d.necessita_midia === "Sim" ? "" : "hidden"}>
            <label>Tema do evento *<input name="midia_tema" maxlength="160" value="${h(d.midia_tema || "")}" placeholder="Ex.: Firmados na Rocha"></label>
            <div class="dupla">${SN("midia_arte", "Precisa de arte para Instagram e WhatsApp?", d.midia_arte).replace(" *<select", "<select").replace("required", "")}
              ${SN("midia_banner", "Precisa de banner impresso?", d.midia_banner).replace(" *<select", "<select").replace("required", "")}</div>
            ${SN("midia_inscricao", "Precisa de formulário de inscrição?", d.midia_inscricao).replace(" *<select", "<select").replace("required", "")}
            <label id="blocoLink" ${d.midia_inscricao === "Sim" ? "" : "hidden"}>Link do formulário de inscrição (se já existir)<input type="url" name="midia_link_inscricao" value="${h(d.midia_link_inscricao || "")}" placeholder="https://forms.gle/..."></label>
            <label>Informações adicionais para a arte/divulgação<textarea name="midia_info" maxlength="1500">${h(d.midia_info || "")}</textarea></label>
          </div>
        </section>
        <section class="card"><h2>Detalhes</h2>
          <label>Detalhes gerais, escala e observações<textarea name="observacoes" maxlength="2000">${h(d.observacoes || "")}</textarea></label>
          <div class="dupla"><label>Seu nome (para contato)<input name="contato_nome" maxlength="120" value="${h(d.contato_nome || "")}" autocomplete="name"></label>
            <label>Seu telefone<input name="contato_telefone" inputmode="tel" maxlength="20" value="${h(d.contato_telefone || "")}" autocomplete="tel"></label></div>
        </section>
        <p class="erro" id="erro" role="alert"></p>
        <button class="btn btn-p" type="submit" id="enviar">${complemento ? "Enviar complemento" : "Enviar ficha"}</button>
        <p><small>Este link vale até ${h(new Date(info.expira_em).toLocaleDateString("pt-BR"))}. Ele permite apenas enviar as informações deste evento.</small></p>
      </form>`;
    const f = document.getElementById("ficha");
    f.addEventListener("change", (e) => {
      if (e.target.name === "necessita_midia") document.getElementById("blocoMidia").hidden = e.target.value !== "Sim";
      if (e.target.name === "midia_inscricao") document.getElementById("blocoLink").hidden = e.target.value !== "Sim";
    });
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(f), err = document.getElementById("erro"), b = document.getElementById("enviar");
      const dados = Object.fromEntries([...fd.entries()].filter(([k]) => k !== "locais"));
      dados.locais = fd.getAll("locais");
      // conferências rápidas (o servidor confere tudo de novo)
      const falta = [];
      if (!dados.titulo?.trim()) falta.push("nome do evento"); if (!dados.data) falta.push("data"); if (!info.ministerio_fixo && !dados.ministerio) falta.push("ministério");
      if (!dados.lider?.trim()) falta.push("líder"); if (!dados.horario_inicio || !dados.horario_fim) falta.push("horários"); if (!dados.locais.length) falta.push("espaço");
      if (!dados.necessita_midia || !dados.necessita_louvor || !dados.necessita_diaconia) falta.push("Mídia, Louvor e Diaconia");
      if (dados.necessita_midia === "Sim" && !dados.midia_tema?.trim()) falta.push("tema do evento");
      if (falta.length) { err.textContent = "Preencha: " + falta.join(", ") + "."; return; }
      if (dados.horario_fim <= dados.horario_inicio) { err.textContent = "O horário de término deve ser depois do início."; return; }
      err.textContent = ""; b.disabled = true; b.textContent = "Enviando…";
      const { data, error } = await sb.rpc("agenda_link_enviar", { p_token: token, p_dados: dados });
      if (error) { err.textContent = error.message || "Não foi possível enviar."; b.disabled = false; b.textContent = complemento ? "Enviar complemento" : "Enviar ficha"; return; }
      tela.innerHTML = `<div class="card ok"><p class="eyebrow">Recebido</p><h2>Obrigado!</h2>
        <p class="lead">${data.versao > 1 ? "O complemento foi registrado." : "A ficha foi enviada."} A coordenação da Agenda vai analisar as informações antes de incluir o evento na Agenda Ministerial.</p>
        <p><small>Enviado em ${h(new Date().toLocaleString("pt-BR"))}${info.permite_complemento ? ". Enquanto estiver em análise, você pode abrir este mesmo link para complementar." : "."}</small></p></div>`;
      window.scrollTo(0, 0);
    });
  }

  (async () => {
    const { data, error } = await sb.rpc("agenda_link_abrir", { p_token: token });
    if (error) return fim("Não foi possível <em>abrir</em>.", "Tente novamente em alguns instantes.");
    if (!data?.ok) return fim(data?.motivo === "expirado" ? "Link <em>expirado</em>." : data?.motivo === "revogado" ? "Link <em>desativado</em>." : "Link <em>inválido</em>.", MOTIVOS[data?.motivo] || MOTIVOS.invalido);
    if (!data.pode_enviar) {
      const st = data.envio?.status;
      return fim(st === "aprovado" ? "Ficha <em>aprovada</em>." : st === "recusado" ? "Ficha <em>analisada</em>." : "Ficha <em>enviada</em>.",
        st === "aprovado" ? "As informações foram aprovadas e incluídas na Agenda Ministerial." : st === "recusado" ? "A coordenação analisou e não incluiu esta ficha. Fale com a coordenação da Agenda." : "As informações já foram enviadas e estão em análise.");
    }
    formulario(data);
  })();
})();
</script>
</body>
</html>
