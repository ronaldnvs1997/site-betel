  <!-- MODAL 0: LOGIN (conta da equipe — mesmo login da Área de Membros) -->
  <div id="modal-login-coord" class="hidden fixed inset-0 bg-black/55 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl border-t-4 border-betel-vinho">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-serif text-xl font-bold text-betel-vinho">🔒 Acesso da Equipe</h3>
        <button onclick="fecharModalLoginCoord()" class="text-stone-400 hover:text-stone-700 font-bold">✕</button>
      </div>
      <p class="text-xs text-stone-500 mb-4">Entre com o e-mail e a senha da sua conta de membro da Igreja Batista Betel (a mesma da Área de Membros). Coordenadores entram no Modo Coordenador; líderes preenchem as fichas do seu ministério.</p>

      <div id="erro-login-coord" class="hidden mb-3 p-2.5 rounded-lg bg-red-100 text-red-800 text-xs font-medium"></div>

      <form onsubmit="autenticarCoordenador(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">E-mail *</label>
          <input type="email" id="login-coord-usuario" required autocomplete="username" placeholder="seu.email@betelflamengo.com.br"
            class="w-full px-3.5 py-2.5 rounded-lg border border-stone-300 text-sm focus:outline-none focus:border-betel-vinho" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-700 mb-1">Senha *</label>
          <input type="password" id="login-coord-senha" required autocomplete="current-password" placeholder="••••••••"
            class="w-full px-3.5 py-2.5 rounded-lg border border-stone-300 text-sm focus:outline-none focus:border-betel-vinho" />
        </div>
        <p class="text-[11px] text-stone-500"><a href="../#equipe/esqueci" class="underline">Esqueci minha senha</a> · <a href="../#equipe/solicitar" class="underline">Solicitar acesso</a></p>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="fecharModalLoginCoord()" class="px-4 py-2 rounded-lg text-sm text-stone-600 hover:bg-stone-100">
            Cancelar
          </button>
          <button type="submit" id="btn-entrar-coord"
            class="px-5 py-2 rounded-lg text-sm font-bold bg-betel-vinho text-betel-dourado hover:bg-betel-vinhoEscuro shadow">
            Entrar
          </button>
        </div>
      </form>
    </div>
  </div>
