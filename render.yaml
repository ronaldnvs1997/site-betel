# Render — Blueprint do Sistema Betel
# O Render hospeda só o SITE (páginas estáticas). Banco de dados, login (Auth), arquivos (Storage)
# e funções de servidor (Edge Functions) ficam no Supabase. Nenhum banco é criado no Render.
#
# No build, o Render só gera site/config.js com o endereço do Supabase e a chave PÚBLICA
# (anon/publishable). A chave service_role nunca entra aqui.
services:
  - type: web
    name: betel-site
    runtime: static
    buildCommand: node scripts/gerar-config.mjs
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        sync: false          # ex.: https://abcdefgh.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false          # chave pública: Project Settings → API → anon / publishable
    routes:
      - type: rewrite
        source: /agendaministerialprivada/evento
        destination: /agendaministerialprivada/evento/index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /agendaministerialprivada/*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /agendaministerialprivada/*
        name: Referrer-Policy
        value: no-referrer
      - path: /agendaministerialprivada/*
        name: Cache-Control
        value: no-store
